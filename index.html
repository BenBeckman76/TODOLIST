<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-name">TaskFlow</div>
        </div>

        <div class="composer" aria-label="Add task form">
          <input
            id="task-title"
            class="task-input"
            type="text"
            placeholder="What do you need to do?"
            aria-label="Task title"
          />

          <input
            id="task-date"
            class="task-date"
            type="date"
            aria-label="Task due date"
          />

          <select id="task-category" class="task-category" aria-label="Choose category">
            <option value="All">All</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Health">Health</option>
            <option value="Personal">Personal</option>
          </select>

          <button id="add-task-btn" class="add-btn" type="button">Add Task +</button>
        </div>
      </header>

      <main class="layout">
        <section class="main-panel">
          <div class="panel-header">
            <h1>Your Tasks</h1>
            <div class="sort-box">
              <label for="sort-select">Sort by:</label>
              <select id="sort-select" aria-label="Sort tasks">
                <option value="manual">Manual</option>
                <option value="date-added">Date Added</option>
                <option value="due-date">Due Date</option>
                <option value="importance">Importance</option>
              </select>
            </div>
          </div>

          <div class="search-row">
            <input
              id="task-search"
              class="search-input"
              type="search"
              placeholder="Search tasks..."
              aria-label="Search tasks"
            />
          </div>

          <ul id="task-list" class="task-list" aria-live="polite"></ul>
        </section>

        <aside class="sidebar">
          <section>
            <h3 class="panel-title">Categories</h3>
            <ul class="category-list" id="category-list">
              <li class="category-item active" data-filter="All">
                <span class="category-label"><span class="category-icon all">✓</span>All Tasks</span>
                <span class="badge-count" id="count-all">0</span>
              </li>
              <li class="category-item" data-filter="Pending">
                <span class="category-label"><span class="category-icon pending">◔</span>Pending</span>
                <span class="badge-count" id="count-pending">0</span>
              </li>
              <li class="category-item" data-filter="Completed">
                <span class="category-label"><span class="category-icon completed">✓</span>Completed</span>
                <span class="badge-count" id="count-completed">0</span>
              </li>
              <li class="category-item" data-filter="Important">
                <span class="category-label"><span class="category-icon important">★</span>Important</span>
                <span class="badge-count" id="count-important">0</span>
              </li>
            </ul>
          </section>

          <section class="stats-box">
            <h3 class="panel-title">Quick Stats</h3>
            <div class="stats-grid">
              <div class="stat-card total">
                <span class="stat-label">Total Tasks</span>
                <strong id="stat-total">0</strong>
              </div>
              <div class="stat-card pending">
                <span class="stat-label">Pending</span>
                <strong id="stat-pending">0</strong>
              </div>
              <div class="stat-card completed">
                <span class="stat-label">Completed</span>
                <strong id="stat-completed">0</strong>
              </div>
              <div class="stat-card important">
                <span class="stat-label">Important</span>
                <strong id="stat-important">0</strong>
              </div>
            </div>
          </section>
        </aside>
      </main>

      <footer class="footer">© 2025 TaskFlow. All rights reserved.</footer>
    </div>

    <div id="task-modal" class="task-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close="modal"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="edit-task-title">
        <div class="modal-header">
          <h2 id="edit-task-title">Edit Task</h2>
          <button type="button" class="modal-close" data-close="modal" aria-label="Close edit dialog">×</button>
        </div>

        <form id="task-edit-form" class="edit-form">
          <label>
            <span>Title</span>
            <input id="edit-task-title-input" type="text" name="title" required />
          </label>

          <label>
            <span>Due date</span>
            <input id="edit-task-date-input" type="date" name="date" />
          </label>

          <label>
            <span>Category</span>
            <select id="edit-task-category-input" name="category">
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Health">Health</option>
              <option value="Personal">Personal</option>
            </select>
          </label>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" data-close="modal">Cancel</button>
            <button type="submit" class="primary-btn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
